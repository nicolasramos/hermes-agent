<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes — Sin conexión</title>
    <!-- Static offline page, precached by the service worker and served by
         PrecacheFallbackPlugin only when a navigation cannot reach the network.
         It must stay dependency-free and must NOT carry the session marker the
         dashboard server injects into its own shell: this page is served
         precisely when that shell could not be fetched. -->
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #1a1a2e;
        color: #e0e0e0;
        text-align: center;
      }
      .container { max-width: 400px; padding: 2rem; }
      h1 { font-size: 1.5rem; color: #7c3aed; margin-bottom: 1rem; }
      p { font-size: 0.95rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hermes Agent</h1>
      <p>No hay conexión de red disponible. Cuando se restablezca, la aplicación se recargará automáticamente.</p>
    </div>
    <script>
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
